<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짤·카드 스튜디오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>짤·카드 스튜디오</h1>
  </header>

  <nav class="tabs" role="tablist">
    <button id="tabEdit" class="tab active" role="tab" aria-selected="true">🎨 편집</button>
    <button id="tabTemplates" class="tab" role="tab" aria-selected="false">📁 템플릿 관리</button>
  </nav>

  <main>
    <!-- ===== 편집 탭 ===== -->
    <div id="editPanel" class="tab-panel active">
      <div class="workflow-steps">
        <span class="step">① 비율 선택</span>
        <span class="step-arrow">›</span>
        <span class="step">② 이미지 업로드</span>
        <span class="step-arrow">›</span>
        <span class="step">③ 문구·위치 조정</span>
        <span class="step-arrow">›</span>
        <span class="step">④ 다운로드</span>
      </div>

      <div class="edit-layout">
        <!-- 좌측: 캔버스 영역 -->
        <section class="canvas-area card">
          <h2 class="section-title">미리보기</h2>
          
          <div class="ratio-buttons">
            <button id="btn1x1" class="active">1:1</button>
            <button id="btn4x5">4:5</button>
            <button id="btn9x16">9:16</button>
            <button id="btn16x9">16:9</button>
            <button id="btn21x9">21:9</button>
          </div>

          <div class="size-controls">
            <label>너비 <input type="text" id="widthInput" inputmode="numeric" value="1080"></label>
            <label>높이 <input type="text" id="heightInput" inputmode="numeric" value="1080"></label>
            <label class="lock"><input type="checkbox" id="lockRatio" checked> 비율 유지</label>
          </div>

          <div class="canvas-wrap">
            <canvas id="preview" width="1080" height="1080"></canvas>
            <div id="emptyOverlay" class="empty-overlay">
              <div class="empty-icon">🖼️</div>
              <p>이미지를 올리거나<br>여기에 끌어다 놓으세요</p>
            </div>
          </div>

          <div class="button-group">
            <button id="resetBtn" class="btn-secondary">초기화</button>
            <button id="downloadBtn" class="btn-download" disabled title="이미지를 먼저 업로드하세요">이미지 다운로드 (PNG)</button>
          </div>
        </section>

        <!-- 우측: 편집 옵션 패널 -->
        <section class="panel card">
          <h2 class="section-title">편집 옵션</h2>

          <div class="control-group">
            <label class="file-label">
              <span class="btn-outline">이미지 선택</span>
              <input type="file" id="fileInput" accept="image/png, image/jpeg" class="hidden-file">
            </label>
            <p class="file-name" id="fileName">선택된 파일 없음</p>
            <p class="error" id="errorMsg"></p>
          </div>

          <div class="control-group">
            <label>문구
              <textarea id="textInput" rows="3">안녕하세요</textarea>
            </label>
          </div>

          <details class="advanced">
            <summary>고급 설정 (위치·세부 조정)</summary>
            <div class="advanced-content">
              <label>X 위치 <input type="range" id="xInput" min="0" max="1" step="0.01" value="0.5"> <span class="val" id="xVal">0.50</span></label>
              <label>Y 위치 <input type="range" id="yInput" min="0" max="1" step="0.01" value="0.5"> <span class="val" id="yVal">0.50</span></label>
              <label>글자 크기 <input type="range" id="sizeInput" min="10" max="200" value="60"> <span class="val" id="sizeVal">60</span></label>
            </div>
          </details>

          <div class="control-group">
            <label>글자 색
              <div class="color-row">
                <input type="color" id="colorInput" value="#ffffff">
                <span id="colorSwatch" class="swatch" style="background:#ffffff"></span>
              </div>
            </label>
          </div>
        </section>
      </div>
    </div>

    <!-- ===== 템플릿 관리 탭 ===== -->
    <div id="templatePanel" class="tab-panel">
      <section class="card template-card">
        <h2 class="section-title">템플릿 관리</h2>

        <div class="template-save-row">
          <input type="text" id="templateName" placeholder="템플릿 이름을 입력하세요">
          <button id="saveTemplateBtn" class="btn-primary">저장</button>
        </div>

        <ul id="templateList" class="template-list"></ul>

        <div class="json-row">
          <button id="exportJsonBtn" class="btn-secondary">JSON 내보내기</button>
          <button id="importJsonBtn" class="btn-secondary">JSON 가져오기</button>
        </div>
      </section>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
