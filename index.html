<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짤·카드 스튜디오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>짤·카드 스튜디오</h1>
  <main>
    <div class="canvas-area">
      <!-- 비율 선택 버튼 -->
      <div class="ratio-buttons">
        <button id="btn1x1" class="active">1:1</button>
        <button id="btn4x5">4:5</button>
        <button id="btn9x16">9:16</button>
      </div>
      
      <!-- 미리보기 캔버스 -->
      <canvas id="preview" width="1080" height="1080"></canvas>
      
      <!-- 다운로드 버튼 -->
      <button id="downloadBtn">이미지 다운로드 (PNG)</button>
    </div>

    <section class="panel">
      <label>이미지 불러오기 (PNG / JPEG)
        <input type="file" id="fileInput" accept="image/png, image/jpeg">
      </label>
      <p class="error" id="errorMsg"></p>

      <label>문구
        <textarea id="textInput" rows="3">안녕하세요</textarea>
      </label>

      <label>X 위치 <input type="range" id="xInput" min="0" max="1" step="0.01" value="0.5"></label>
      <label>Y 위치 <input type="range" id="yInput" min="0" max="1" step="0.01" value="0.5"></label>
      <label>글자 크기 <input type="range" id="sizeInput" min="10" max="200" value="60"></label>
      <label>글자 색 <input type="color" id="colorInput" value="#ffffff"></label>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
