<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>짤·카드 스튜디오</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>짤·카드 스튜디오</h1>
  <main>
    <div class="canvas-area">
      <div class="ratio-buttons">
        <button id="btn1x1" class="active">1:1</button>
        <button id="btn4x5">4:5</button>
        <button id="btn9x16">9:16</button>
      </div>

      <div class="size-controls">
        <label>너비 <input type="text" id="widthInput" inputmode="numeric" value="1080"></label>
        <label>높이 <input type="text" id="heightInput" inputmode="numeric" value="1080"></label>
        <label class="lock"><input type="checkbox" id="lockRatio" checked> 비율 유지</label>
      </div>

      <canvas id="preview" width="1080" height="1080"></canvas>

      <button id="downloadBtn">이미지 다운로드 (PNG)</button>
    </div>

    <section class="panel">
      <label>이미지 불러오기 (PNG / JPEG)
        <input type="file" id="fileInput" accept="image/png, image/jpeg">
      </label>
      <p class="error" id="errorMsg"></p>

      <label>문구
        <textarea id="textInput" rows="3">안녕하세요</textarea>
      </label>

      <label>X 위치 <input type="range" id="xInput" min="0" max="1" step="0.01" value="0.5"></label>
      <label>Y 위치 <input type="range" id="yInput" min="0" max="1" step="0.01" value="0.5"></label>
      <label>글자 크기 <input type="range" id="sizeInput" min="10" max="200" value="60"></label>
      <label>글자 색 <input type="color" id="colorInput" value="#ffffff"></label>

      <!-- 템플릿 관리 영역 -->
      <hr style="width: 100%; border: 1px solid #ddd; margin: 16px 0;">
      <h3 style="margin: 0; font-size: 16px;">템플릿 관리</h3>

      <div style="display: flex; gap: 8px;">
        <input type="text" id="templateName" placeholder="템플릿 이름" style="flex: 1; padding: 6px;">
        <button id="saveTemplateBtn" style="padding: 6px 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">저장</button>
      </div>

      <ul id="templateList" style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;">
        <!-- 저장된 템플릿 목록이 여기에 동적으로 추가됩니다 -->
      </ul>

      <!-- JSON 내보내기/가져오기 영역 추가 -->
      <div style="display: flex; gap: 8px; margin-top: 8px;">
        <button id="exportJsonBtn" style="flex: 1; padding: 8px; cursor: pointer; background: #6c757d; color: white; border: none; border-radius: 4px;">JSON 내보내기</button>
        <button id="importJsonBtn" style="flex: 1; padding: 8px; cursor: pointer; background: #6c757d; color: white; border: none; border-radius: 4px;">JSON 가져오기</button>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
